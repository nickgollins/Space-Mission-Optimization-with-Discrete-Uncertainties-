[tool.poetry]
name = "nga"
version = "0.1.0"
description = "Package for exploration campaign scheduling with uncertainty using noisy genetic algorithm"
authors = ["Gollins, Nicholas John <ngollins3@gatech.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.1.1"
scipy = "^1.14.1"
gurobipy = "^12.0"
Pyomo = "^6.8.0"
matplotlib = "^3.9.2"
pandas = "^2.2.2"
openpyxl = "^3.1.5"
networkx = "^3.3"
pytest = "^8.3.3"
jupyter = "^1.1.1"
notebook = "^7.3.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


